name: ci

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw

      - name: Build and test backend
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run billing series concurrency E2E
        run: npm run e2e:billing-series:ci

  e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up approved Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Grant Maven wrapper permission
        run: chmod +x backend/mvnw
      - name: Ephemeral authenticated no-write gate
        working-directory: frontend
        run: node e2e/qa/run-qa.mjs

  e2e-commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up approved Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Grant Maven wrapper permission
        run: chmod +x backend/mvnw
      - name: Complete isolated commercial and UX gate
        working-directory: frontend
        run: node e2e/qa/run-recovery.mjs
      - name: Validate sanitized final evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readdir } from 'node:fs/promises';
          import { resolve, join } from 'node:path';
          import { readRecoveryEvidence, validateRecoveryEvidence } from './frontend/e2e/qa/run-recovery.mjs';
          const base = resolve('backend/target/recovery-e2e');
          const runs = (await readdir(base)).filter(name => /^[a-f0-9]{24}$/.test(name));
          if (runs.length !== 1) throw Error('QA_SINGLE_RUN_EVIDENCE_REQUIRED');
          const directory = join(base, runs[0], 'evidence');
          const { summary, progress } = await readRecoveryEvidence(directory);
          // Publish only the inspected allowlist, including safe evidence of a failed run.
          await appendFile(process.env.GITHUB_OUTPUT, `directory=${directory}\n`);
          validateRecoveryEvidence(summary, progress);
          NODE
      - name: Upload sanitized commercial evidence
        if: always() && steps.evidence.outputs.directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-commercial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

