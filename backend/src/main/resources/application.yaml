spring:
  application:
    name: erp-pos-backend
  servlet:
    multipart:
      max-file-size: ${ECOMMERCE_IMAGE_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${ECOMMERCE_IMAGE_MULTIPART_MAX_REQUEST_SIZE:10MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_pos}
    username: ${DB_USER:erp_user}
    password: ${DB_PASSWORD:erp_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      harden_default_seed_users: ${HARDEN_DEFAULT_SEED_USERS:false}
      harden_default_seed_users_include_admin: ${HARDEN_DEFAULT_SEED_USERS_INCLUDE_ADMIN:false}

server:
  port: ${SERVER_PORT:8080}

app:
  ecommerce:
    public-images:
      allowed-domains: ${ECOMMERCE_PUBLIC_IMAGE_ALLOWED_DOMAINS:}
    image-storage:
      provider: ${ECOMMERCE_IMAGE_STORAGE_PROVIDER:none}
      region: ${AWS_REGION:us-east-1}
      bucket: ${ECOMMERCE_IMAGE_S3_BUCKET:}
      prefix: ${ECOMMERCE_IMAGE_S3_PREFIX:}
      public-base-url: ${ECOMMERCE_IMAGE_PUBLIC_BASE_URL:}
      cache-control: ${ECOMMERCE_IMAGE_CACHE_CONTROL:public, max-age=31536000, immutable}
      max-size-bytes: ${ECOMMERCE_IMAGE_MAX_SIZE_BYTES:5242880}
      max-width: ${ECOMMERCE_IMAGE_MAX_WIDTH:6000}
      max-height: ${ECOMMERCE_IMAGE_MAX_HEIGHT:6000}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    jwt:
      secret: ${JWT_SECRET:change-this-secret-at-least-32-characters-long}
      expiration-ms: ${JWT_EXPIRATION:3600000}
