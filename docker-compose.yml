services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-pos-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-pos-backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      HARDEN_DEFAULT_SEED_USERS: ${HARDEN_DEFAULT_SEED_USERS:-false}
      HARDEN_DEFAULT_SEED_USERS_INCLUDE_ADMIN: ${HARDEN_DEFAULT_SEED_USERS_INCLUDE_ADMIN:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-pos-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
